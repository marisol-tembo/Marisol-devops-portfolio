name: Terraform Deploy

on:
  push:
    branches:
      - main

jobs:
  terraform-deploy:
    name: Validate and deploy Terraform
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init

      - name: Validate Terraform
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Read website bucket name
        id: bucket
        run: |
          BUCKET_NAME=$(terraform output -raw website_bucket_name)
          echo "name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload website to S3
        working-directory: .
        run: |
          aws s3 sync website/ \
            "s3://${{ steps.bucket.outputs.name }}" \
            --delete
            
      - name: Display website URL
        run: |
        echo "Website URL: $(terraform output -raw website_url)"